name: Update V2Ray Nodes

on:
  schedule:
    - cron: '0 */2 * * *'   # 每2小时运行一次
  workflow_dispatch:       # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python py/fast.py

      - name: E2 link speed test, write all alive nodes to fast-top.txt
        env:
          E2_SSH_KEY: ${{ secrets.E2_SSH_KEY }}
        run: |
          # E2（新加坡）上用 sing-box 真实链路测速：真的走节点去下载，比 TCP 延迟准
          mkdir -p ~/.ssh
          printf '%s\n' "$E2_SSH_KEY" > ~/.ssh/e2_key
          chmod 600 ~/.ssh/e2_key
          ssh-keyscan -H 149.118.35.233 >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/e2_key -o StrictHostKeyChecking=no fast.txt ubuntu@149.118.35.233:/home/ubuntu/tb-speedtest/in-fast.txt
          # 2026-11-08 修：GitHub runner 经 Azure 出站，TCP 空闲 4 分钟即被掐；
          # test_nodes.py 经 SSH 管道输出时 Python 会块缓冲，几分钟无流量就触发
          # "Connection reset by peer"（exit 255）。-u 强制逐行输出 + ServerAliveInterval
          # 每 15 秒保活，两处一起堵死空闲超时。
          ssh -i ~/.ssh/e2_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3 ubuntu@149.118.35.233 "cd /home/ubuntu/tb-speedtest && python3 -u test_nodes.py in-fast.txt out-fast-top.txt 0 1000000"
          scp -i ~/.ssh/e2_key -o StrictHostKeyChecking=no ubuntu@149.118.35.233:/home/ubuntu/tb-speedtest/out-fast-top.txt fast-top.txt
          # E2 上没有存活节点时也保证文件存在（空文件），避免提交步骤报错
          touch fast-top.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast.txt fast-top.txt
          git commit -m "Update fast.txt and fast-top.txt with latest decoded nodes" || echo "No changes to commit"
          git push
